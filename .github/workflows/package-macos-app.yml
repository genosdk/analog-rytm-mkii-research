name: Package AR MKII Emulator macOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-macos-app.yml'
      - 'qemu/**'

concurrency:
  group: package-ar-mk2-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout AR research
        uses: actions/checkout@v4
        with:
          path: research

      - name: Checkout upstream QEMU
        uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          path: qemu-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and packaging dependencies
        run: |
          brew install glib pixman ninja pkg-config dylibbundler
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python - <<'PY'
          import tkinter
          print('tkinter', tkinter.TkVersion)
          PY

      - name: Inject AR MKII QEMU machine
        run: |
          cp research/qemu/hw/m68k/elektron_ar_mk2.c qemu-src/hw/m68k/
          cp research/qemu/hw/m68k/ar_mk2_intc_pit.c qemu-src/hw/m68k/
          cp research/qemu/hw/m68k/ar_mk2_dspi.c qemu-src/hw/m68k/
          cp research/qemu/hw/m68k/ar_mk2_dtim.c qemu-src/hw/m68k/
          printf "\nm68k_ss.add(files('elektron_ar_mk2.c', 'ar_mk2_intc_pit.c', 'ar_mk2_dspi.c', 'ar_mk2_dtim.c'))\n" >> qemu-src/hw/m68k/meson.build

      - name: Configure QEMU
        working-directory: qemu-src
        run: |
          ./configure \
            --target-list=m68k-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-cocoa

      - name: Build custom QEMU
        working-directory: qemu-src
        run: ninja -C build qemu-system-m68k

      - name: Verify custom QEMU
        run: |
          qemu-src/build/qemu-system-m68k -machine help | grep elektron-ar-mk2
          file qemu-src/build/qemu-system-m68k

      - name: Freeze desktop frontend
        working-directory: research
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name 'AR MKII Emulator' \
            --osx-bundle-identifier 'org.photonos.armk2emulator' \
            qemu/run_desktop_emulator.py

      - name: Embed QEMU and dynamic libraries
        run: |
          APP='research/dist/AR MKII Emulator.app'
          QEMU="$APP/Contents/MacOS/qemu-system-m68k"
          cp qemu-src/build/qemu-system-m68k "$QEMU"
          chmod +x "$QEMU"
          mkdir -p "$APP/Contents/Frameworks"

          echo 'QEMU dependencies before bundling:'
          otool -L "$QEMU"

          dylibbundler \
            -od \
            -b \
            -x "$QEMU" \
            -d "$APP/Contents/Frameworks/" \
            -p '@executable_path/../Frameworks/'

          echo 'QEMU dependencies after bundling:'
          otool -L "$QEMU"

      - name: Sign and verify app
        run: |
          APP='research/dist/AR MKII Emulator.app'
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Smoke-test packaged executable
        run: |
          APP='research/dist/AR MKII Emulator.app'
          "$APP/Contents/MacOS/AR MKII Emulator" --self-test
          "$APP/Contents/MacOS/qemu-system-m68k" -machine help | grep elektron-ar-mk2

      - name: Package ZIP
        run: |
          APP='research/dist/AR MKII Emulator.app'
          OUT="AR-MKII-Emulator-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          shasum -a 256 "$OUT" > "${OUT}.sha256"
          file "$APP/Contents/MacOS/AR MKII Emulator" > "AR-MKII-Emulator-${{ matrix.arch }}.architecture.txt"
          file "$APP/Contents/MacOS/qemu-system-m68k" >> "AR-MKII-Emulator-${{ matrix.arch }}.architecture.txt"

      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: AR-MKII-Emulator-macOS-${{ matrix.arch }}
          path: |
            AR-MKII-Emulator-${{ matrix.arch }}.zip
            AR-MKII-Emulator-${{ matrix.arch }}.zip.sha256
            AR-MKII-Emulator-${{ matrix.arch }}.architecture.txt
          retention-days: 30
