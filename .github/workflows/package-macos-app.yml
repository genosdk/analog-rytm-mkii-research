name: Package AR MKII Emulator macOS

# Standalone app packaging is an explicit release gate, never a push side effect.
on:
  workflow_dispatch:

concurrency:
  group: package-ar-mk2-macos-final2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout AR research
        uses: actions/checkout@v5
        with:
          path: research

      - name: Checkout upstream QEMU
        uses: actions/checkout@v5
        with:
          repository: qemu/qemu
          ref: 35500e5c41aec76cde59befe750600dac7a9e37a
          path: qemu-src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and packaging dependencies
        run: |
          brew install glib pixman ninja pkg-config dylibbundler
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python - <<'PY'
          import tkinter
          print('tkinter', tkinter.TkVersion)
          PY

      - name: Inject AR MKII QEMU machine
        run: |
          patch -d qemu-src -p1 < research/qemu/patches/0001-m68k-reset-coldfire-emac-mask.patch
          patch -d qemu-src -p1 < research/qemu/patches/0002-m68k-fix-coldfire-emac-dual-detection.patch
          patch -d qemu-src -p1 < research/qemu/patches/0003-m68k-fix-coldfire-emac-load-operands.patch
          cp research/qemu/hw/m68k/elektron_ar_mk2.c qemu-src/hw/m68k/
          cp research/qemu/hw/m68k/ar_mk2_intc_pit.c qemu-src/hw/m68k/
          cp research/qemu/hw/m68k/ar_mk2_dspi.c qemu-src/hw/m68k/
          cp research/qemu/hw/m68k/ar_mk2_dtim.c qemu-src/hw/m68k/
          printf "\nm68k_ss.add(files('elektron_ar_mk2.c', 'ar_mk2_intc_pit.c', 'ar_mk2_dspi.c', 'ar_mk2_dtim.c'))\n" >> qemu-src/hw/m68k/meson.build

      - name: Configure QEMU
        working-directory: qemu-src
        run: |
          ./configure \
            --target-list=m68k-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-cocoa

      - name: Build custom QEMU
        working-directory: qemu-src
        run: ninja -C build qemu-system-m68k

      - name: Verify custom QEMU
        run: |
          qemu-src/build/qemu-system-m68k -machine help | grep elektron-ar-mk2
          file qemu-src/build/qemu-system-m68k

      - name: Freeze desktop frontend
        working-directory: research
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name 'AR MKII Emulator' \
            --osx-bundle-identifier 'org.photonos.armk2emulator' \
            qemu/run_desktop_emulator.py

      - name: Embed QEMU and dynamic libraries
        run: |
          APP='research/dist/AR MKII Emulator.app'
          QEMU="$APP/Contents/MacOS/qemu-system-m68k"

          # PyInstaller seals the app when it creates it. Remove only the outer
          # resource envelope before adding our QEMU payload; nested PyInstaller
          # code signatures remain intact and will be preserved by final sealing.
          rm -rf "$APP/Contents/_CodeSignature"

          cp qemu-src/build/qemu-system-m68k "$QEMU"
          chmod +x "$QEMU"

          # Keep QEMU's Homebrew dependencies outside PyInstaller's managed
          # Contents/Frameworks tree. This prevents alias/symlink collisions and
          # makes the added nested code explicit for signing.
          mkdir -p "$APP/Contents/QEMULibs"
          dylibbundler \
            -od \
            -b \
            -x "$QEMU" \
            -d "$APP/Contents/QEMULibs/" \
            -p '@executable_path/../QEMULibs/'
          otool -L "$QEMU"

      - name: Sign and verify app
        run: |
          APP='research/dist/AR MKII Emulator.app'
          QEMU="$APP/Contents/MacOS/qemu-system-m68k"

          xattr -cr "$APP" || true
          rm -rf "$APP/Contents/_CodeSignature"

          # Sign only the code we added. Do not traverse PyInstaller's MacOS/
          # _internal alias tree; its nested binaries were already signed by
          # PyInstaller and remain untouched.
          while IFS= read -r -d '' f; do
            codesign --force --timestamp=none --sign - "$f"
          done < <(find "$APP/Contents/QEMULibs" -maxdepth 1 -type f -print0)
          codesign --force --timestamp=none --sign - "$QEMU"

          # Recreate the outer resource seal after every added resource exists.
          codesign --force --deep --timestamp=none --sign - "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"

      - name: Smoke-test packaged executable
        run: |
          APP='research/dist/AR MKII Emulator.app'
          "$APP/Contents/MacOS/AR MKII Emulator" --self-test
          "$APP/Contents/MacOS/qemu-system-m68k" -machine help | grep elektron-ar-mk2

      - name: Package ZIP
        run: |
          APP='research/dist/AR MKII Emulator.app'
          OUT="AR-MKII-Emulator-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          shasum -a 256 "$OUT" > "${OUT}.sha256"
          file "$APP/Contents/MacOS/AR MKII Emulator" > "AR-MKII-Emulator-${{ matrix.arch }}.architecture.txt"
          file "$APP/Contents/MacOS/qemu-system-m68k" >> "AR-MKII-Emulator-${{ matrix.arch }}.architecture.txt"

      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: AR-MKII-Emulator-macOS-${{ matrix.arch }}
          path: |
            AR-MKII-Emulator-${{ matrix.arch }}.zip
            AR-MKII-Emulator-${{ matrix.arch }}.zip.sha256
            AR-MKII-Emulator-${{ matrix.arch }}.architecture.txt
          retention-days: 30
