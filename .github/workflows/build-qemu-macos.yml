name: Build AR MKII QEMU macOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-qemu-macos.yml'
      - 'qemu/hw/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout AR research
        uses: actions/checkout@v4
        with:
          path: research

      - name: Checkout upstream QEMU
        uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          path: qemu-src
          fetch-depth: 1

      - name: Install build dependencies
        run: brew install glib pixman ninja pkg-config

      - name: Inject AR MKII research machine
        run: |
          cp research/qemu/hw/m68k/elektron_ar_mk2.c qemu-src/hw/m68k/
          cp research/qemu/hw/m68k/ar_mk2_intc_pit.c qemu-src/hw/m68k/
          printf "\nm68k_ss.add(files('elektron_ar_mk2.c', 'ar_mk2_intc_pit.c'))\n" >> qemu-src/hw/m68k/meson.build

      - name: Configure m68k-softmmu only
        working-directory: qemu-src
        run: |
          ./configure \
            --target-list=m68k-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-cocoa

      - name: Build
        working-directory: qemu-src
        run: ninja -C build qemu-system-m68k

      - name: Verify custom machine
        working-directory: qemu-src
        run: |
          build/qemu-system-m68k -machine help | grep elektron-ar-mk2
          file build/qemu-system-m68k

      - name: Package binary
        run: |
          mkdir -p artifact
          cp qemu-src/build/qemu-system-m68k artifact/
          shasum -a 256 artifact/qemu-system-m68k > artifact/SHA256SUMS
          file artifact/qemu-system-m68k > artifact/ARCHITECTURE.txt

      - name: Upload QEMU artifact
        uses: actions/upload-artifact@v4
        with:
          name: ar-mk2-qemu-macos-${{ matrix.arch }}
          path: artifact/
          retention-days: 30
