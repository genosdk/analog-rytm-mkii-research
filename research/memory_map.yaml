  main_size: 2903032
  entry_candidate: 0x40000870

cpu:
  family: NXP/Freescale ColdFire MCF5441x
  qemu_candidate: cfv4e
  notes: Firmware uses V4-class ColdFire instructions including MAC/EMAC and FPU-class features.

memory:
  - name: sdram
    type: ram
    base: 0x40000000
    size: 0x08000000
    status: strong_hypothesis
    notes: MCF5441x SDRAM aperture begins at 0x40000000. 128 MiB is inferred from firmware switching SP to 0x48000000; confirm against hardware/bootloader later.

  - name: main_loaded_image
    type: sdram_initialized_image
    base: 0x40000400
    size: 0x002C4FF8
    notes: Decompressed MAIN is copied/loaded into executable SDRAM, not a ROM mapping.

  - name: firmware_stack_top
    type: sdram_address
    addr: 0x48000000
    notes: Early MAIN entry switches A7/SP to this exact address.

  - name: internal_sram_backdoor
    type: aliased_sram
    base: 0x80000000
    aperture_end: 0x8C000000
    physical_size: 0x00010000
    notes: MCF5441x 64 KiB internal SRAM is visible through the backdoor aperture; emulator should alias/wrap addresses to the 64 KiB backing store as the hardware does.

  - name: rapid_gpio
    type: mmio
    base: 0x8C000000
    end: 0x90000000

runtime_objects:
  - name: runtime_param_table
    base: 0x8000E5B0
    size: 0x00000444
    backing: internal_sram_backdoor
    notes: 13 tracks × 42 uint16 live parameters, plus nearby control words.

  - name: param_state_table
    base: 0x80005F10
    size: 0x00000444
    backing: internal_sram_backdoor
    notes: Per-parameter companion state/update table.

